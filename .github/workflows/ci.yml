name: CI

# Nothing ran these tests before. The repo ships seven test modules (101 tests
# collected; six at the repository root plus one under
# adapters/agent-plugins-multica/), and README.md:192 documents the project's
# own pre-commit norm:
#
#   "提交改动前运行完整 Python 测试、CLI help smoke test 和地址静态搜索。"
#
# Nothing under .github enforced any of it. This workflow covers the first two
# clauses -- the full Python test suite and the CLI help smoke test. It does
# NOT run the third (地址静态搜索, the static address search), so a green run
# here is not evidence that the whole documented norm was satisfied.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ${{ vars.CI_5070X_ENABLED == 'true' && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && (contains(fromJSON('["ubuntu-latest","ubuntu-24.04"]'), matrix.os) && 'ci-5070x-linux' || contains(fromJSON('["windows-latest","windows-2025"]'), matrix.os) && 'ci-5070x-windows') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # README.md:31 and :228 declare "Python 3.9+"; the newer entry is what
        # the project is actually developed on.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          # The suite uses only stdlib and local modules, so the OS axis adds
          # little beyond a path-separator check; keep the full Python axis.
          - os: windows-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python --version

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      # The suite is unittest-based and imports only stdlib plus sibling
      # modules, so it runs from the repository root with no install step.
      - name: Run tests
        run: python -m pytest -q --no-header

  cli-smoke:
    name: CLI help smoke
    runs-on: ${{ vars.CI_5070X_ENABLED == 'true' && (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'ci-5070x-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # README.md:192 names the CLI help smoke test alongside the Python tests.
      # --help must exit 0 without touching a deployment target.
      - name: multica_deploy --help
        run: python multica_deploy.py --help

      - name: fleet_plan --help
        run: python fleet_plan.py --help
